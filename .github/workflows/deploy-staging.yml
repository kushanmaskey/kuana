name: Deploy to Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H p3plzcpnl475181.prod.phx3.secureserver.net >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          cd client/dist && zip -r ../../deploy.zip . && cd ../..
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            deploy.zip \
            ${{ secrets.SSH_USERNAME }}@p3plzcpnl475181.prod.phx3.secureserver.net:public_html/staging.kuana.org/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@p3plzcpnl475181.prod.phx3.secureserver.net \
            "cd public_html/staging.kuana.org && unzip -o deploy.zip && rm deploy.zip"
